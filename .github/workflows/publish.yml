name: Publish

# Trusted publishing: npm authenticates this workflow through GitHub's OIDC
# token instead of a publish token, so no npm credential exists to leak or
# expire. npmjs.com must list this exact filename as the package's trusted
# publisher. Publishing is a two-step flow — this workflow only stages the
# version; a maintainer then approves it on npmjs.com to make it installable.
on:
  push:
    tags: ['v*']
  # Lets a release be published without re-cutting its tag.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm reads in place of a publish token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Deliberately no `registry-url` above: it writes an .npmrc pinning the
      # auth token to NODE_AUTH_TOKEN, which is unset here — npm would then
      # authenticate with an empty token instead of exchanging the OIDC one.
      # The default registry is already registry.npmjs.org.
      - name: npm must be new enough to understand trusted publishing
        run: |
          npm install -g npm@latest
          node -v && npm -v
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC: request URL present"
          else
            echo "OIDC: MISSING — the id-token permission did not reach this step"
            exit 1
          fi
      - name: The tag must name the version it publishes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - run: npm ci
      # Staged, not direct: npm requires proof of presence on every publish,
      # and a CI credential cannot supply one — an OIDC token included. This
      # uploads the tarball to the stage queue, where a maintainer approves it
      # with a second factor on npmjs.com and only then does it go live.
      # prepublishOnly still runs clean + check + build, so every gate is inside
      # this step, and provenance is attached the same way.
      - run: npm stage publish
